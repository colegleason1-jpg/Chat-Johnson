name: keepalive
# Keeps the Streamlit Community Cloud copy awake so its in-process worker keeps ticking while session keys
# are held in memory. Set the DEPLOY_URL repository variable; without it the job exits quietly.
# GitHub schedules a workflow only from the default branch, so this file must live on main.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health view
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then echo "::notice::DEPLOY_URL is not set; nothing to ping."; exit 0; fi
          # Cloud answers the first request with a 303 that sets a cookie and points back at the app, so the
          # ping keeps a cookie jar and follows the redirects; a curl failure is reported, never a red run.
          jar=$(mktemp)
          code=$(curl -s -L --max-redirs 10 -c "$jar" -b "$jar" -o /tmp/health.out -w "%{http_code}" --max-time 90 "${DEPLOY_URL%/}/?health=1" || echo "curl-exit-$?")
          echo "health=$code"
          head -c 300 /tmp/health.out 2>/dev/null; echo
          case "$code" in 2*) exit 0;; *) echo "::warning::health returned $code"; exit 0;; esac
