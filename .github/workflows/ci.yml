name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Requirements.txt
      - name: Install dependencies
        run: pip install -r Requirements.txt
      - name: Lint
        run: ruff check app.py cli.py orchestrator research tests
      - name: Compile
        run: python -m py_compile app.py cli.py orchestrator/*.py research/*.py
      - name: Test
        run: pytest -q
