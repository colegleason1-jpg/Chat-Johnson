# docker compose up -d --build   (see docs/RUNBOOK.md)
services:
  app:
    build:
      context: .
      args:
        WITH_BROWSER: "0"
    # No env_file here on purpose: provider keys live in the worker only. The app gets the job key
    # (to hand session secrets to the worker encrypted) and its own settings.
    environment:
      CHAT_JOHNSON_JOB_WORKERS: "0"            # the worker container owns every background job
      CHAT_JOHNSON_JOB_KEY: ${CHAT_JOHNSON_JOB_KEY:-}
      CHAT_JOHNSON_REPO_ROOTS: ${CHAT_JOHNSON_REPO_ROOTS:-}
      CHAT_JOHNSON_DB_PATH: /data/vault.db
      CHAT_JOHNSON_SELF_HOSTED: "1"
      CHAT_JOHNSON_LOCAL_ENDPOINT: http://ollama:11434/v1
      CHAT_JOHNSON_LOCAL_MODEL: llama3.1:8b
      # Snapshot settings only, never provider keys: without these the app creates a fresh vault before the worker
      # can restore the bucket, and the restore is then skipped because the vault is no longer empty.
      CHAT_JOHNSON_SUPABASE_URL: ${CHAT_JOHNSON_SUPABASE_URL:-}
      CHAT_JOHNSON_SUPABASE_KEY: ${CHAT_JOHNSON_SUPABASE_KEY:-}
      CHAT_JOHNSON_VAULT_BUCKET: ${CHAT_JOHNSON_VAULT_BUCKET:-chat-johnson-vault}
      CHAT_JOHNSON_VAULT_SNAPSHOT_MINUTES: ${CHAT_JOHNSON_VAULT_SNAPSHOT_MINUTES:-10}
    volumes:
      - data:/data
    expose:
      - "8501"
    depends_on:
      - ollama
    restart: unless-stopped
  worker:
    build:
      context: .
      args:
        WITH_BROWSER: "1"
    command: ["python", "-m", "orchestrator.jobs", "--worker", "--workers", "2"]
    env_file: .env
    environment:
      CHAT_JOHNSON_DB_PATH: /data/vault.db
      CHAT_JOHNSON_SELF_HOSTED: "1"
      CHAT_JOHNSON_LOCAL_ENDPOINT: http://ollama:11434/v1
      CHAT_JOHNSON_LOCAL_MODEL: llama3.1:8b
    volumes:
      - data:/data
    healthcheck:
      disable: true
    depends_on:
      - ollama
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest   # pin a tag once the model you use is settled
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
  caddy:
    image: caddy:2
    # With DOMAIN set: 80/443 on the internet with automatic TLS and basic auth. Without one:
    # 127.0.0.1:8080 only, reached through an SSH tunnel (never plain HTTP on the internet).
    ports:
      - "${CADDY_BIND:-127.0.0.1:8080}:80"
      - "${CADDY_BIND_TLS:-127.0.0.1:8443}:443"
    environment:
      DOMAIN: ${DOMAIN:-}
      CADDY_USER: ${CADDY_USER:-operator}
      CADDY_HASH: ${CADDY_HASH:-}
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
volumes:
  data: {}
  ollama: {}
  caddy_data: {}
  caddy_config: {}
